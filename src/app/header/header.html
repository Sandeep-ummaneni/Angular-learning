<div class="header">
  <div class="logo">
  <img src="https://cdn-icons-png.flaticon.com/128/124/124579.png" height="50" width="50"/>
<h1>{{ labels().title }}</h1>
</div>
<div class="menu">
   <h1><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">{{ labels().home }}</a></h1>
   <h1><a routerLink="/image" routerLinkActive="active">{{ labels().image }}</a></h1>
    <h1><a routerLink="/live" routerLinkActive="active">{{ labels().live }}</a></h1>
  <h1><a routerLink="/news/all" routerLinkActive="active">{{ labels().news }}</a></h1> 
   <h1><a routerLink="/distance" routerLinkActive="active">{{ labels().distance }}</a></h1>
   <h1><a routerLink="/security" routerLinkActive="active">{{ labels().security }}</a></h1>
   <button type="button" (click)="setLanguage('en')" [class]="language() === 'en' ? 'lang-btn active' : 'lang-btn'">EN</button>
   <button type="button" (click)="setLanguage('Te')" [class]="language() === 'Te' ? 'lang-btn active' : 'lang-btn'">TE</button>
   <span class="auth-chip">{{ isAuthenticated() ? 'JWT' : 'Guest' }}</span>
  </div>
</div>
